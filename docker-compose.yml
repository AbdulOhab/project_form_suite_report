version: '3.8'

services:
  mongodb:
    image: docker.io/library/mongo:7.0
    container_name: project_form_suite_database
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - project_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: project_form_suite_app
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      PORT: 5053
      MONGODB_URI: mongodb://mongodb:27017/instancereport
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      # Same-origin SPA + API, so CORS points at the app's own public URL.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5053}
    ports:
      - "5053:5053"
    volumes:
      - app_uploads:/app/uploads
    networks:
      - project_network
    restart: unless-stopped

volumes:
  mongo_data:
  app_uploads:

networks:
  project_network:
    driver: bridge
